<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ccvd baseline: one pixel</title>
    <link rel="stylesheet" href="../baseline.css">
    <style>
      .square {
        top: 216px;
        left: 296px;
        width: 9px;
        height: 9px;
        background: #1f2933;
      }

      .pixel {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 1px;
        height: 1px;
        background: #1f2934;
      }
    </style>
  </head>
  <body>
    <header>ccvd baseline</header>
    <main>
      <h1>One pixel</h1>
      <p>The centre pixel of the square turns one shade bluer.</p>
      <div class="square"><div class="pixel"></div></div>
    </main>
  </body>
</html>
